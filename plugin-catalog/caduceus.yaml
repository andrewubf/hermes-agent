sha: b245d3c37c23ef5848cc1a663479dedfa38f08cd
description: "Answers about your own health that cite your DNA, Apple Health trends, medical records and new research, from a vault on your machine. Caduceus imports 23andMe or AncestryDNA raw data, a Promethease report, an Apple Health export and US health records (FHIR) into local SQLite, then gives your agent gene–drug checks (CPIC guidelines plus GLP-1 research), trends before and after a medication start, a rebuilt variant report, a one-page brief for your doctor and a research watch on your genes. Privacy levels are yours to choose: open by default, or standard, which hides Alzheimer's risk, hereditary cancer risk, carrier status, mental health and reproductive results until you unlock them. Information with limits, not medical advice. Disclosure — imports, search and reports run locally, and the vault is never uploaded as a whole; tool results (slices of your data) enter the conversation, so the model provider you chose sees them; a research watch you turn on sends gene, drug and topic terms, never genotypes, to Europe PMC and NCBI; scheduled checks run model turns billed like any message; no telemetry. Includes a report-a-problem skill: the agent drafts a bug report, asks you to check it holds no health data, and files it to this repository with `gh` only after you approve the draft."
