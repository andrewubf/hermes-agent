subdir: tusk
version: "0.1.0"
title: Tusk
description: "Hermes long-term memory on Walrus mainnet (decentralized storage on Sui) through the official Walrus Memory SDK: encrypted inside the relayer's TEE, owned by your key, survives wiping or reinstalling Hermes, and is the same on every machine and for other agents on the same account and namespace. Recall before each turn, turn capture, built-in memory mirroring and pre-compression saves; a crash-safe, rate-paced SQLite write outbox with a receipt per memory; /tusk (status, proofs, recall, verify, retry) and hermes tusk (status, recall, proofs, verify, import, flush, restore). Every memory has a public Walruscan proof link, and verify fetches blobs straight from a public aggregator to check they are ciphertext. Disclosure — each turn's user message (as the recall query), finished turns (for fact extraction), built-in memory entries and tusk_remember facts are sent over HTTPS to relayer.memory.walrus.xyz (or MEMWAL_SERVER_URL) under MEMWAL_PRIVATE_KEY / MEMWAL_ACCOUNT_ID; verify downloads blobs from aggregator.walrus-mainnet.walrus.space; queued writes (plaintext until sent) and receipts are kept in plugin-data/tusk/ledger.db; one in-process background writer thread; no shell commands, no subprocesses, no telemetry."
maintainer: Automationbot24x7
tier: community
category: memory
requires_hermes: ">=0.23.0"
docs_url: https://github.com/Automationbot24x7/hermes-tusk#readme
readme: true
platforms: [linux, macos, windows]
known_issues:
  - "The Walrus Memory relayer has no per-memory delete yet (whole-namespace erasure only), so removing a built-in memory entry does not delete its Walrus copy."
  - "Writes are paced (about 6 per minute) and take 10-20 s each; one-shot hermes chat -q runs usually exit before the queue drains. Queued writes go out on the next run or with hermes tusk flush."
capabilities:
  provides_tools: []
  provides_hooks: []
  provides_middleware: []
  requires_env:
    - MEMWAL_PRIVATE_KEY
    - MEMWAL_ACCOUNT_ID
